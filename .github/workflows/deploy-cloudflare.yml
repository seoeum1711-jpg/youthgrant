name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ENV: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_ACCESS_TOKEN: ${{ secrets.OPS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure Ops secret
        run: printf '%s' "$OPS_ACCESS_TOKEN" | npx wrangler secret put OPS_ACCESS_TOKEN --env "$CLOUDFLARE_ENV"
      - name: Apply migrations and deploy application once
        run: node scripts/cloudflare-deploy.mjs "$CLOUDFLARE_ENV"
